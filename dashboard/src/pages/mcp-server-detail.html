<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MonsterMQ - MCP Server Detail</title>
    <script type="module" src="/js/ix-init.js"></script>
    <script src="/js/storage.js"></script>
    <script src="/js/graphql-client.js"></script>
    <script src="/js/ui.js"></script>
    <script src="/js/log-viewer.js"></script>
    <script src="/js/sidebar.js"></script>
    
</head>
<body>
    <ix-application force-breakpoint="lg">
    <ix-menu application-name="MonsterMQ" pinned start-expanded>
    </ix-menu>
    <div class="main-content" id="main-content">
        <div class="container">
            <div class="page-header">
                <div class="page-header-content">
                    <div>
                        <nav class="breadcrumb" aria-label="Breadcrumb">
                            <a href="/pages/mcp-servers.html">MCP Servers</a>
                            <span class="breadcrumb-sep" aria-hidden="true">/</span>
                            <span class="breadcrumb-current" aria-current="page" id="breadcrumb-name">&hellip;</span>
                        </nav>
                        <h1 class="page-title" id="page-title">MCP Server</h1>
                        <p class="page-subtitle" id="page-subtitle"></p>
                    </div>
                    <div class="page-header-actions">
                        <button class="btn btn-danger btn-small" id="delete-btn" onclick="showDeleteModal()">Delete</button>
                        <button class="btn btn-primary btn-small" id="save-server-btn" onclick="saveServer()">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                                <path d="M17 3H5c-1.11 0-2 .9-2 2v14c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V7l-4-4zm-5 16c-1.66 0-3-1.34-3-3s1.34-3 3-3 3 1.34 3 3-1.34 3-3 3zm3-10H5V5h10v4z"/>
                            </svg>
                            Save Server
                        </button>
                    </div>
                </div>
            </div>

            <!-- MCP Server Configuration Section -->
            <div class="section-card" id="server-content" style="display:none;">
                <div class="section-header">
                    <div class="section-title"><h2>MCP Server Configuration</h2></div>
                    <span class="status-badge status-enabled" id="server-status">ENABLED</span>
                </div>
                <div class="section-content">
                    <form id="server-form">
                        <div class="form-grid">
                            <div class="form-group">
                                <label for="server-name">Name *</label>
                                <input type="text" id="server-name" required>
                            </div>
                            <div class="form-group">
                                <label for="server-namespace">Namespace</label>
                                <input type="text" id="server-namespace" placeholder="mcp">
                            </div>
                            <div class="form-group full-width">
                                <label for="server-url">URL *</label>
                                <input type="text" id="server-url" required placeholder="http://localhost:3001/mcp">
                            </div>
                            <div class="form-group">
                                <label for="server-transport">Transport</label>
                                <select id="server-transport">
                                    <option value="http">HTTP</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <div class="checkbox-group" style="margin-top: 1.75rem;">
                                    <input type="checkbox" id="server-enabled">
                                    <label for="server-enabled" style="margin-bottom: 0; font-weight: normal;">Enabled</label>
                                </div>
                            </div>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Timestamps Section -->
            <div class="section-card" id="timestamps-section" style="display:none;">
                <div class="section-header">
                    <div class="section-title"><h2>Timestamps</h2></div>
                </div>
                <div class="section-content">
                    <div class="info-grid">
                        <div class="info-item"><div class="info-label">Created At</div><div class="info-value" id="server-created-at">-</div></div>
                        <div class="info-item"><div class="info-label">Updated At</div><div class="info-value" id="server-updated-at">-</div></div>
                    </div>
                </div>
            </div>

            <div id="loading-indicator" class="loading-indicator" style="display: none;">
                <div class="loading-spinner"></div>
                <span>Loading&hellip;</span>
            </div>

            <div id="error-message" class="error-message" style="display: none;">
                <div class="error-content">
                    <span class="error-icon">&#9888;</span>
                    <span class="error-text"></span>
                </div>
            </div>
        </div>
    </div>

    <!-- Confirm Delete Modal -->

    <script src="/js/mcp-server-detail.js"></script>
    </ix-application>
</body>
</html>
