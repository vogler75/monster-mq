<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MonsterMQ - Topic Schema Policies</title>
    <script type="module" src="/js/ix-init.js"></script>
    <script src="/js/storage.js"></script>
    <script src="/js/graphql-client.js"></script>
    <script src="/js/log-viewer.js"></script>
    <script src="/js/sidebar.js"></script>
    <style>

        
        .enforcement-badge {
            display: inline-flex;
            align-items: center;
            padding: 0.3rem 0.6rem;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .enforcement-reject {
            background: rgba(239, 68, 68, 0.15);
            color: var(--monster-red);
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .enforcement-warn {
            background: rgba(249, 115, 22, 0.15);
            color: var(--monster-orange);
            border: 1px solid rgba(249, 115, 22, 0.3);
        }

        .enforcement-log {
            background: rgba(59, 130, 246, 0.15);
            color: var(--accent-blue);
            border: 1px solid rgba(59, 130, 246, 0.3);
        }

        
        .topic-filter-tag {
            background: var(--background-secondary);
            color: var(--text-secondary);
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            font-size: 0.7rem;
            font-family: 'JetBrains Mono', monospace;
        }@media (max-width: 768px) {

            .btn-icon.small { width:28px; height:28px; }
}</style>
</head>
<body>
    <ix-application force-breakpoint="lg">
    <ix-menu application-name="MonsterMQ" pinned start-expanded>
    </ix-menu>
    <div class="main-content" id="main-content">
        <div class="container">
            <div class="page-header">
                <h1 class="page-title">Topic Schema Policies</h1>
                <p class="page-subtitle">Manage reusable JSON Schema definitions</p>
            </div>

            <div id="policies-table" class="data-table">
                <div class="table-header">
                    <div class="table-title">
                        <h2>Schema Policies</h2>
                    </div>
                    <div class="table-actions">
                        <ix-icon-button icon="refresh" variant="secondary" ghost onclick="refreshPolicies()" title="Refresh policies"></ix-icon-button>
                        <a href="/pages/topic-schema-policy-detail.html?new=true" class="btn btn-primary" style="text-decoration:none;"><ix-icon name="add-circle" size="16"></ix-icon> Add Policy</a>
                    </div>
                </div>
                <table>
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Payload Type</th>
                            <th>Version</th>
                            <th>Description</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="policies-table-body">
                        <!-- Policy rows will be populated here -->
                    </tbody>
                </table>
            </div>

            <div id="loading-indicator" class="loading-indicator" style="display: none;">
                <div class="loading-spinner"></div>
                <span>Loading policies&hellip;</span>
            </div>

            <div id="error-message" class="error-message" style="display: none;">
                <div class="error-content">
                    <span class="error-icon">&#9888;</span>
                    <span class="error-text"></span>
                </div>
            </div>
        </div>
    </div>

    <!-- Confirm Delete Modal -->
    <div id="confirm-delete-modal" class="modal" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Confirm Delete</h3>
                <button class="modal-close" onclick="hideConfirmDeleteModal()">&times;</button>
            </div>
            <div class="modal-body">
                <p>Are you sure you want to delete the policy "<span id="delete-policy-name"></span>"?</p>
                <p>This action cannot be undone.</p>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" onclick="hideConfirmDeleteModal()">Cancel</button>
                <button type="button" class="btn btn-danger" onclick="confirmDeletePolicy()">Delete</button>
            </div>
        </div>
    </div>

    <script src="/js/topic-schema-policies.js"></script>
    </ix-application>
</body>
</html>
