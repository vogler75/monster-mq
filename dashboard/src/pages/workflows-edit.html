<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MonsterMQ - Edit Flow</title>
    <script>
        // Redirect to the appropriate editor based on type parameter
        const urlParams = new URLSearchParams(window.location.search);
        const type = urlParams.get('type');
        const name = urlParams.get('name');

        if (type === 'class') {
            // Redirect class edits to the visual editor
            window.location.href = '/pages/workflows-visual.html?' + window.location.search.substring(1);
        } else if (type === 'instance') {
            window.location.href = '/pages/workflows-edit-instance.html?' + window.location.search.substring(1);
        } else {
            // Default to instance editor if type is not specified
            window.location.href = '/pages/workflows-edit-instance.html?' + window.location.search.substring(1);
        }
    </script>
    <script type="module" src="/js/ix-init.js"></script>
    <link rel="stylesheet" href="/css/script-editor-modal.css" />
    <script src="/js/storage.js"></script>
    <script src="/js/graphql-client.js"></script>
    <script src="/js/sidebar.js"></script>
    <script src="/js/script-editor-modal.js"></script>
    <script src="/js/help-modal.js"></script>
    <style>

        .page-header-info {
            flex: 1;
            min-width: 200px;
        }

        
        .header-checkbox-wrapper {
            margin-right: 1rem;
        }

        .header-checkbox {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.875rem;
            color: var(--text-primary);
            cursor: pointer;
            user-select: none;
        }

        .header-checkbox input[type="checkbox"] {
            width: 18px;
            height: 18px;
            margin: 0;
            cursor: pointer;
            accent-color: var(--monster-purple, var(--primary-color));
        }

        .header-checkbox span {
            font-weight: 500;
        }

        
        textarea.script {
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
            font-size: 0.9rem;
            width: 100%;
            min-height: 300px;
            padding: 1rem;
            background: var(--dark-bg, var(--background-primary));
            border: 1px solid var(--dark-border, var(--border-color));
            border-radius: 8px;
            color: var(--text-primary);
            line-height: 1.5;
            resize: vertical;
            tab-size: 4;
            box-sizing: border-box;
        }

        textarea.script:focus {
            outline: none;
            border-color: var(--monster-purple, var(--primary-color));
        }

        .keyvalue-table td input {
            width: 100%;
            box-sizing: border-box;
        }

        
        .inline-editor {
            background: var(--dark-bg, var(--background-primary));
            padding: 1.5rem;
            border: 1px solid var(--dark-border, var(--border-color));
            border-radius: 8px;
            margin-top: 1rem;
        }

        
        .topic-browser-side-panel {
            position: fixed;
            top: 48px;
            right: -400px;
            width: 380px;
            min-width: 300px;
            max-width: 600px;
            height: calc(100vh - 48px);
            background: var(--dark-surface);
            border-left: 1px solid var(--dark-border);
            z-index: 1000;
            transition: right 0.3s ease;
            display: flex;
            flex-direction: column;
            box-shadow: -4px 0 8px rgba(0, 0, 0, 0.2);
            resize: horizontal;
            overflow: hidden;
        }

        .topic-browser-side-panel.open {
            right: 0;
        }

        
        .topic-panel-resize-handle {
            position: absolute;
            left: -5px;
            top: 0;
            width: 10px;
            height: 100%;
            cursor: col-resize;
            background: transparent;
            z-index: 1001;
        }

        .topic-panel-resize-handle:hover {
            background: rgba(124, 58, 237, 0.3);
        }

        .topic-panel-resize-handle:active {
            background: rgba(124, 58, 237, 0.5);
        }

        
        body.topic-panel-open .main-content {
            transition: margin-right 0.3s ease;
        }

        
        .topic-browser-floating-toggle {
            position: fixed;
            right: 20px;
            top: 50%;
            transform: translateY(-50%) rotate(-90deg);
            background: var(--monster-purple);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 8px 8px 0 0;
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            z-index: 999;
            box-shadow: -2px -2px 8px rgba(0, 0, 0, 0.2);
            transform-origin: center;
        }

        .topic-browser-floating-toggle:hover {
            background: var(--monster-dark);
            right: 15px;
        }

        .topic-browser-floating-toggle.active {
            background: var(--monster-dark);
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .topic-browser-floating-toggle .toggle-icon {
            transition: transform 0.3s ease;
        }

        .topic-browser-floating-toggle.active .toggle-icon {
            transform: rotate(180deg);
        }@media (max-width: 1024px) {
            .topic-browser-side-panel {
                width: 320px;
                min-width: 280px;
            }
            
            .topic-browser-floating-toggle {
                right: 15px;
                padding: 0.6rem 1.2rem;
                font-size: 0.8rem;
            }
}@media (max-width: 768px) {
            .topic-browser-side-panel {
                width: 100vw;
                right: -100vw;
                min-width: 100vw;
                max-width: 100vw;
            }
            
            .topic-browser-floating-toggle {
                right: 10px;
                padding: 0.5rem 1rem;
            }
            
            body.topic-panel-open .main-content {
                margin-right: 0;
                display: none;
            }
}

        .topic-panel-header {
            padding: 1rem;
            background: var(--dark-surface-2);
            border-bottom: 1px solid var(--dark-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            min-height: 60px;
        }

        .topic-panel-title {
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-primary);
            margin: 0;
        }

        .topic-panel-close {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 0.5rem;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .topic-panel-close:hover {
            background: var(--dark-border);
            color: var(--text-primary);
        }

        .topic-panel-archive-select {
            margin: 0.5rem 1rem;
            display: flex;
            gap: 0.5rem;
            align-items: center;
            font-size: 0.875rem;
        }

        .topic-panel-archive-select label {
            color: var(--text-primary);
            font-weight: 500;
            min-width: 80px;
        }

        .topic-panel-archive-select select {
            flex: 1;
            padding: 0.5rem;
            background: var(--dark-bg);
            border: 1px solid var(--dark-border);
            border-radius: 6px;
            color: var(--text-primary);
            font-size: 0.875rem;
        }

        .topic-panel-tree {
            flex: 1;
            overflow-y: auto;
            padding: 0.5rem;
        }

        .topic-panel-tree .tree-node {
            margin: 0;
            padding: 0;
            list-style: none;
        }

        .topic-panel-tree .tree-item {
            display: flex;
            align-items: center;
            padding: 0.4rem 0.5rem;
            cursor: pointer;
            border-radius: 4px;
            transition: background-color 0.2s;
            user-select: none;
            font-size: 0.875rem;
        }

        .topic-panel-tree .tree-item:hover {
            background: rgba(124, 58, 237, 0.1);
        }

        .topic-panel-tree .tree-item.has-data {
            color: var(--monster-green);
            font-weight: 500;
        }

        .topic-panel-tree .tree-item.draggable {
            cursor: grab;
        }

        .topic-panel-tree .tree-item.draggable:active {
            cursor: grabbing;
        }

        .topic-panel-tree .tree-toggle {
            width: 16px;
            height: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 0.4rem;
            border: none;
            background: none;
            color: var(--text-muted);
            cursor: pointer;
            border-radius: 2px;
            transition: all 0.2s;
            font-size: 0.75rem;
        }

        .topic-panel-tree .tree-toggle:hover {
            background: var(--dark-border);
            color: var(--text-primary);
        }

        .topic-panel-tree .tree-toggle.expanded {
            transform: rotate(90deg);
        }

        .topic-panel-tree .tree-toggle:empty {
            visibility: hidden;
        }

        .topic-panel-tree .tree-children {
            margin-left: 1rem;
            border-left: 1px solid var(--dark-border);
            padding-left: 0.4rem;
        }

        .topic-panel-tree .tree-children.collapsed {
            display: none;
        }

        .topic-panel-tree .tree-icon {
            margin-right: 0.4rem;
            color: var(--text-muted);
            font-size: 0.75rem;
        }

        .topic-panel-tree .tree-icon.folder {
            color: var(--monster-purple);
        }

        .topic-panel-tree .tree-icon.topic {
            color: var(--monster-green);
        }

        .topic-panel-data {
            height: 200px;
            min-height: 60px;
            max-height: 80vh;
            padding: 0.5rem;
            background: var(--dark-bg);
            border-top: 1px solid var(--dark-border);
            overflow-y: auto;
        }
        .topic-panel-data-resize { height: 6px; cursor: row-resize; background: transparent; border-top: 1px solid var(--dark-border); flex-shrink: 0; }
        .topic-panel-data-resize:hover, .topic-panel-data-resize:active { background: rgba(124, 58, 237, 0.3); }

        .topic-panel-data.empty {
            display: none;
        }

        .topic-panel-data-content {
            font-family: 'Fira Code', 'JetBrains Mono', monospace;
            font-size: 0.8rem;
            line-height: 1.4;
            color: var(--text-primary);
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .topic-browser-toggle {
            background: var(--monster-purple);
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .topic-browser-toggle:hover {
            background: var(--monster-dark);
        }

        .topic-browser-toggle.active {
            background: var(--monster-dark);
        }

        
        .drop-zone {
            border: 2px dashed transparent;
            transition: border-color 0.2s;
        }

        .drop-zone.drag-over {
            border-color: var(--monster-green);
            background: rgba(34, 197, 94, 0.1);
        }

        .badge-node {
            background: #24352d;
            color: #46e08c;
        }

        
        .section {
            margin-top: 2rem;
        }

        .connections-grid {
            margin-top: 0.5rem;
        }

        .link-back {
            font-size: 0.8rem;
            color: var(--primary-color);
            text-decoration: none;
        }

        .link-back:hover {
            text-decoration: underline;
        }

        .danger {
            color: #ff4757;
        }</style>
</head>
<body>
    <ix-application force-breakpoint="lg">
    <ix-menu application-name="MonsterMQ" pinned start-expanded>
    </ix-menu>
    <div class="main-content" id="main-content">
        <div class="container">
    <div class="container" id="editor-root">
        <div class="page-header">
            <div class="page-header-content">
                <div class="page-header-info">
                    <nav class="breadcrumb" aria-label="Breadcrumb">
                        <a href="/pages/workflows.html">Workflows</a>
                        <span class="breadcrumb-sep" aria-hidden="true">/</span>
                        <span class="breadcrumb-current" aria-current="page" id="breadcrumb-name">&hellip;</span>
                    </nav>
                    <h1 class="page-title" id="page-title">Edit Flow</h1>
                    <p class="page-subtitle" id="page-subtitle"></p>
                </div>
                <div class="page-header-actions" id="header-actions" style="display:none;">
                    <button class="btn btn-primary btn-small" style="min-width:90px;" onclick="FlowEdit.save()">Save</button>
                    <button class="btn btn-danger btn-small" id="delete-button" style="display:none;" onclick="FlowEdit.deleteItem()">Delete</button>
                </div>
            </div>
        </div>

        <div id="form-section"></div>

        <div class="section-card" id="nodes-section" style="display:none;">
            <div class="section-header">
                <h2>Nodes</h2>
                <button class="btn btn-secondary btn-small" onclick="FlowEdit.addNode()">+ Add Node</button>
            </div>
            <div class="section-content">
                <table class="data-table" id="nodes-table">
                    <thead><tr>
                        <th>ID</th><th>Name</th><th>Inputs</th><th>Outputs</th><th>Lang</th><th>Actions</th>
                    </tr></thead>
                    <tbody></tbody>
                </table>
                <div id="node-inline-editor" class="inline-editor" style="display:none;"></div>
            </div>
        </div>

        <div class="section-card" id="connections-section" style="display:none;">
            <div class="section-header">
                <h2>Connections</h2>
                <button class="btn btn-secondary btn-small" onclick="FlowEdit.addConnectionRow()">+ Add Connection</button>
            </div>
            <div class="section-content">
                <table class="data-table" id="connections-table">
                    <thead><tr><th>From Node</th><th>From Output</th><th>To Node</th><th>To Input</th><th></th></tr></thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>

        <div id="mappings-section" style="display:none;">
            <div class="section-card">
                <div class="section-header">
                    <h2>Input Mappings
                        <button onclick="openHelp('inputs')" class="btn-icon" style="margin-left: 0.5rem; width: 24px; height: 24px; font-size: 0.75rem; border: none; background: transparent; cursor: pointer;" title="Help: Input Mappings">?</button>
                    </h2>
                    <button class="btn btn-secondary btn-small" onclick="FlowEdit.addInputMapping()">+ Add Input</button>
                </div>
                <div class="section-content">
                    <table class="data-table" id="input-mappings-table">
                        <thead><tr><th>Node Input</th><th>Type</th><th>Value</th><th></th></tr></thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>

            <div class="section-card">
                <div class="section-header">
                    <h2>Output Mappings
                        <button onclick="openHelp('outputs')" class="btn-icon" style="margin-left: 0.5rem; width: 24px; height: 24px; font-size: 0.75rem; border: none; background: transparent; cursor: pointer;" title="Help: Output Mappings">?</button>
                    </h2>
                    <button class="btn btn-secondary btn-small" onclick="FlowEdit.addOutputMapping()">+ Add Output</button>
                </div>
                <div class="section-content">
                    <table class="data-table" id="output-mappings-table">
                        <thead><tr><th>Node Output</th><th>Topic</th><th></th></tr></thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>

            <div class="section-card">
                <div class="section-header">
                    <h2>Variables
                        <button onclick="openHelp('variables')" class="btn-icon" style="margin-left: 0.5rem; width: 24px; height: 24px; font-size: 0.75rem; border: none; background: transparent; cursor: pointer;" title="Help: Variables - How to use them in scripts">?</button>
                    </h2>
                    <button class="btn btn-secondary btn-small" onclick="FlowEdit.addVariable()">+ Add Variable</button>
                </div>
                <div class="section-content">
                    <table class="data-table keyvalue-table" id="variables-table">
                        <thead><tr><th>Key</th><th>Value</th><th></th></tr></thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>
        </div>

    </div>
    </div>

    <!-- Floating Topic Browser Toggle -->
    <button class="topic-browser-floating-toggle" id="topic-browser-floating-toggle" onclick="TopicBrowserSidePanel.toggle()">
        <svg class="toggle-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M22 19a2 2 0 01-2 2H4a2 2 0 01-2-2V5a2 2 0 012-2h5l2 3h9a2 2 0 012 2z"/>
        </svg>
        Topics
    </button>

    <!-- Topic Browser Side Panel -->
    <div class="topic-browser-side-panel" id="topic-browser-panel">
        <div class="topic-panel-resize-handle" id="topic-panel-resize-handle"></div>
        <div class="topic-panel-header">
            <h3 class="topic-panel-title">Topic Browser</h3>
            <button class="topic-panel-close" onclick="TopicBrowserSidePanel.close()">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>
        </div>
        <div class="topic-panel-archive-select">
            <label for="topic-panel-archive-group">Archive:</label>
            <select id="topic-panel-archive-group">
                <option value="">Loading&hellip;</option>
            </select>
        </div>
        <div class="topic-panel-tree">
            <ul id="topic-panel-tree-root" class="tree-node">
                <!-- Tree will be populated here -->
            </ul>
        </div>
        <div class="topic-panel-data-resize" id="topic-panel-data-resize"></div>
        <div class="topic-panel-data empty" id="topic-panel-data">
            <div class="topic-panel-data-content" id="topic-panel-data-content"></div>
        </div>
    </div>

    <script src="/js/ui.js"></script>
    <script src="/js/log-viewer.js"></script>
    <script src="/js/workflows-edit.js"></script>
    <script src="/js/topic-browser-side-panel.js"></script>
    <script>
        // Filter log viewer by Flow Instance when editing an instance
        (function() {
            const urlParams = new URLSearchParams(window.location.search);
            const type = urlParams.get('type');
            const instanceName = urlParams.get('name');
            
            if (type === 'instance' && instanceName) {
                // Wait for log viewer to be ready
                window.onLogViewerReady(function(logViewer) {
                    // Filter by message starting with [instance-name]
                    const messageRegex = `^\\[${instanceName.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')}\\]`;
                    const title = `Logs: ${instanceName}`;
                    
                    // Update the global log viewer with instance-specific filters
                    logViewer.setFilters({
                        messageRegex: messageRegex
                    });
                    
                    // Update title
                    if (logViewer.elements && logViewer.elements.root) {
                        const titleEl = logViewer.elements.root.querySelector('.log-viewer-title span:not(.chevron):not(.log-viewer-badge)');
                        if (titleEl) {
                            titleEl.textContent = title;
                        }
                    }
                });
            }
        })();
    </script>
    </ix-application>
</body>
</html>
