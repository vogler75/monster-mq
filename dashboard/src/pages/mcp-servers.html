<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MonsterMQ - MCP Servers</title>
    <script type="module" src="/js/ix-init.js"></script>
    <script src="/js/storage.js"></script>
    <script src="/js/graphql-client.js"></script>
    <script src="/js/ui.js"></script>
    <script src="/js/log-viewer.js"></script>
    <script src="/js/sidebar.js"></script>
    <style>
        .transport-badge {
            display: inline-flex;
            align-items: center;
            padding: 0.3rem 0.6rem;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            background: rgba(59, 130, 246, 0.15);
            color: #3B82F6;
            border: 1px solid rgba(59, 130, 246, 0.3);
        }</style>
</head>
<body>
    <ix-application force-breakpoint="lg">
    <ix-menu application-name="MonsterMQ" pinned start-expanded>
    </ix-menu>
    <div class="main-content" id="main-content">
        <div class="container">
            <div class="page-header">
                <h1 class="page-title">MCP Server Management</h1>
                <p class="page-subtitle">Configure and manage Model Context Protocol servers</p>
            </div>

            <div class="metrics-grid" style="margin-bottom: 2rem;">
                <div class="metric-card">
                    <div class="metric-header">
                        <span class="metric-title">Total Servers</span>
                        <div class="metric-icon is-info"><ix-icon name="network-device" size="12"></ix-icon></div>
                    </div>
                    <div class="metric-value" id="total-servers">0</div>
                    <div class="metric-label">Configured Servers</div>
                </div>

                <div class="metric-card">
                    <div class="metric-header">
                        <span class="metric-title">Enabled Servers</span>
                        <div class="metric-icon is-ok"><ix-icon name="success" size="12"></ix-icon></div>
                    </div>
                    <div class="metric-value" id="enabled-servers">0</div>
                    <div class="metric-label">Active Servers</div>
                </div>
            </div>

            <div id="mcp-servers-table" class="data-table">
                <div class="table-header">
                    <div class="table-title">
                        <h2>MCP Server Configuration</h2>
                    </div>
                    <div class="table-actions">
                        <ix-icon-button icon="refresh" variant="subtle-tertiary" onclick="refreshMcpServers()" title="Refresh servers"></ix-icon-button>
                        <a href="/pages/mcp-server-detail.html?new=true" class="btn btn-primary"><ix-icon name="add-circle" size="16"></ix-icon> Add MCP Server</a>
                    </div>
                </div>
                <table>
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>URL</th>
                            <th>Transport</th>
                            <th>Enabled</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="mcp-servers-table-body">
                    </tbody>
                </table>
            </div>

            <div id="loading-indicator" class="loading-indicator" style="display: none;">
                <div class="loading-spinner"></div>
                <span>Loading MCP servers&hellip;</span>
            </div>

            <div id="error-message" class="error-message" style="display: none;">
                <div class="error-content">
                    <span class="error-icon">&#9888;</span>
                    <span class="error-text"></span>
                </div>
            </div>
        </div>
    </div>

    <!-- Confirm Delete Modal -->

    <script src="/js/mcp-servers.js"></script>
    </ix-application>
</body>
</html>
