# ==============================================================================
# MonsterMQ Default Configuration
# Storage backend: SQLite (embedded, zero-configuration)
# ==============================================================================

# Network Ports
TCP: 1883
WS: 1884
# TCPS: 8883 # Enable for MQTT over TLS (requires server-keystore.jks)
# WSS: 8884  # Enable for MQTT over Secure WebSocket (requires server-keystore.jks)

# Clustering / Node Identity
NodeName: local

# Storage Engine Configuration
# Options: SQLITE, POSTGRES, MONGODB, CRATEDB, MEMORY
DefaultStoreType: SQLITE

# Queuing & Subscriptions
QueuedMessagesEnabled: true
AllowRootWildcardSubscription: true

# SQLite Configuration (embedded database folder)
SQLite:
  Path: "sqlite"
  EnableWAL: true

# Web Dashboard & GraphQL API
GraphQL:
  Enabled: true
  Port: 4000
  Path: /graphql

# Model Context Protocol (MCP) Server for AI Tools
MCP:
  Enabled: true
  Port: 3000

# User Management & Authentication (disabled by default for quickstart)
UserManagement:
  Enabled: false
  PasswordAlgorithm: bcrypt
  CacheRefreshInterval: 60
  DisconnectOnUnauthorized: true

# Metrics Collection
Metrics:
  Enabled: true
  CollectionIntervalSeconds: 10
  RetentionHours: 24
  MaxHistoryRows: 3600

# In-memory logging buffer for Web Dashboard log viewer
Logging:
  Memory:
    Enabled: true
    Entries: 1000

# Feature Flags (all enabled)
Features:
  OpcUa: true
  OpcUaServer: true
  MqttClient: true
  Kafka: true
  Nats: true
  Redis: true
  RedisServer: true
  Telegram: true
  WinCCOa: true
  WinCCUa: true
  Plc4x: true
  Neo4j: true
  JdbcLogger: true
  InfluxDBLogger: true
  TimeBaseLogger: true
  SparkplugB: true
  FlowEngine: true
  Agents: true
  GenAi: true
  Mcp: true
  KafkaServer: true
  SchemaPolicy: true
  TopicNamespace: true
  DeviceImportExport: true
  Zenoh: true
  Hmi: true
