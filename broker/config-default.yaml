TCP: 1883
WS: 1884

NodeName: local
DefaultStoreType: SQLITE

HMI:
  Enabled: true
  Path: "./data/hmi"
  MountPath: "/hmi"

QueuedMessagesEnabled: true
AllowRootWildcardSubscription: true

SQLite:
  Path: "sqlite"
  EnableWAL: true

GraphQL:
  Enabled: true
  Port: 4000
  Path: /graphql

MCP:
  Enabled: true
  Port: 3000

UserManagement:
  Enabled: false

Metrics:
  Enabled: true

Logging:
  Memory:
    Enabled: true
    Entries: 1000

# Feature Flags (all enabled by default)
Features:
  OpcUa: true
  OpcUaServer: true
  MqttClient: true
  Kafka: true
  Nats: true
  Redis: true
  RedisServer: true
  Telegram: true
  WinCCOa: true
  WinCCUa: true
  Plc4x: true
  Neo4j: true
  JdbcLogger: true
  InfluxDBLogger: true
  TimeBaseLogger: true
  SparkplugB: true
  FlowEngine: true
  Agents: true
  GenAi: true
  Mcp: true
  KafkaServer: true
  SchemaPolicy: true
  TopicNamespace: true
  DataCatalog: true
  DeviceImportExport: true
  Zenoh: true
  Hmi: true
  I3xClient: true
  Redfish: false
