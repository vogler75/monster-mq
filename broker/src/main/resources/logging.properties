handlers = java.util.logging.ConsoleHandler, java.util.logging.FileHandler

# Default logging level for all loggers (can be overridden per-logger below)
.level = INFO

# FileHandler writes rolling logs to log/monster.log.0
java.util.logging.FileHandler.level = ALL
java.util.logging.FileHandler.pattern = log/monster.log.%g
java.util.logging.FileHandler.limit = 10485760
java.util.logging.FileHandler.count = 10
java.util.logging.FileHandler.formatter = java.util.logging.SimpleFormatter
java.util.logging.FileHandler.append = true

# ConsoleHandler writes to standard output
java.util.logging.ConsoleHandler.level = ALL
java.util.logging.ConsoleHandler.formatter = java.util.logging.SimpleFormatter

java.util.logging.SimpleFormatter.format=[%1$tF %1$tT.%1$tL][%4$-7s][%3$-40.40s] %5$s %n%6$s

# Netty channel pipeline log level. The verbose "Wrong message type" warnings and stack traces
# are programmatically intercepted and cleanly logged by our logging Filter in Utils.initLogging().
io.netty.channel.DefaultChannelPipeline.level = WARNING

# MongoDB driver logging (routed via SLF4J-to-JUL bridge)
org.mongodb.driver.level = WARNING
